name: Update Family Calendar

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay scheduled runs slightly
    # during high load - that's fine for a fridge display.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests icalendar recurring-ical-events tzdata

      - name: Generate calendar page
        run: python generate_calendar.py
        env:
          ADULTS_ICS_URL: ${{ secrets.ADULTS_ICS_URL }}
          YUV_ICS_URL: ${{ secrets.YUV_ICS_URL }}
          IVAAN_ICS_URL: ${{ secrets.IVAAN_ICS_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
